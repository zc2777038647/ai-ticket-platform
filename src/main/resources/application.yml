spring:
  application:
    name: ai-ticket-platform

  profiles:
    default: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  security:
    jwt:
      issuer: ai-ticket-platform
      access-token-ttl: PT2H
      secret-base64: ${JWT_SECRET_BASE64}

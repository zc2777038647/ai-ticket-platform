spring:
  application:
    name: ai-ticket-platform

  profiles:
    default: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

app:
  idempotency:
    create-ticket:
      enabled: ${CREATE_TICKET_IDEMPOTENCY_ENABLED:true}
      key-prefix: ${CREATE_TICKET_IDEMPOTENCY_KEY_PREFIX:ai-ticket:idempotency:create-ticket}
      processing-ttl-seconds: ${CREATE_TICKET_IDEMPOTENCY_PROCESSING_TTL_SECONDS:120}
      success-ttl-seconds: ${CREATE_TICKET_IDEMPOTENCY_SUCCESS_TTL_SECONDS:86400}
      minimum-key-length: ${CREATE_TICKET_IDEMPOTENCY_MINIMUM_KEY_LENGTH:8}
      maximum-key-length: ${CREATE_TICKET_IDEMPOTENCY_MAXIMUM_KEY_LENGTH:128}

  rate-limit:
    login:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      key-prefix: ${LOGIN_RATE_LIMIT_KEY_PREFIX:ai-ticket:rate-limit:login}
      ip:
        max-requests: ${LOGIN_RATE_LIMIT_IP_MAX_REQUESTS:20}
        window-seconds: ${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:60}
      username:
        max-requests: ${LOGIN_RATE_LIMIT_USERNAME_MAX_REQUESTS:10}
        window-seconds: ${LOGIN_RATE_LIMIT_USERNAME_WINDOW_SECONDS:60}

  security:
    jwt:
      issuer: ai-ticket-platform
      access-token-ttl: PT2H
      secret-base64: ${JWT_SECRET_BASE64}

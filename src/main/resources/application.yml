spring:
  application:
    name: ai-ticket-platform

  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  security:
    jwt:
      issuer: ai-ticket-platform
      access-token-ttl: PT2H
      secret-base64: ${JWT_SECRET_BASE64}

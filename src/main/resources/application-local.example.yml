spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ai_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ai_ticket_user
    password: replace_with_local_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

  global-config:
    banner: false

app:
  ai:
    enabled: true
    base-url: http://127.0.0.1:8000
    internal-token: replace-with-local-internal-token
    connect-timeout: 2s
    read-timeout: 10s

spring:
  application:
    name: ai-ticket-platform
  profiles:
    default: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

app:
  rate-limit:
    login:
      enabled: false
      key-prefix: ai-ticket:test:rate-limit:login
      ip:
        max-requests: 1000
        window-seconds: 60
      username:
        max-requests: 1000
        window-seconds: 60

  security:
    jwt:
      issuer: ai-ticket-platform
      access-token-ttl: PT2H
      secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
